/* ================= THEME TOKENS ================= */
:root,html[data-theme="light"]{
  color-scheme:only light;
  --bg:#FFFFFF;
  --card-bg:#FFFFFF;
  --text-primary:#111111;
  --text-secondary:#666666;
  --border-color:#E2E2E2;
  --chip-text:#111111;
  --chip-bg:#FFFFFF;
  --chip-active-text:#FFFFFF;
  --chip-active-bg:#000000;
  --placeholder:#8A8A8A;
  --accent:#B8566C;
  --accent-soft:rgba(184,86,108,.16);
  --shadow:0 18px 50px -28px rgba(0,0,0,.25);
}
html[data-theme="dark"]{
  color-scheme:only dark;
  --bg:#111111;
  --card-bg:#1A1A1A;
  --text-primary:#FFFFFF;
  --text-secondary:#B0B0B0;
  --border-color:rgba(255,255,255,.25);
  --chip-text:#FFFFFF;
  --chip-bg:transparent;
  --chip-active-text:#000000;
  --chip-active-bg:#FFFFFF;
  --placeholder:#777777;
  --accent:#E6A6A6;
  --accent-soft:rgba(230,166,166,.18);
  --shadow:0 18px 50px -22px rgba(0,0,0,.7);
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;background-color:var(--bg);background-image:linear-gradient(var(--bg),var(--bg))}
body{
  background-color:var(--bg);
  background-image:linear-gradient(var(--bg),var(--bg));
  background-attachment:fixed;
  color:var(--text-primary);
  font-family:'Jost',sans-serif;
  font-weight:300;
  -webkit-font-smoothing:antialiased;
  transition:background .5s ease,color .5s ease;
  overflow-x:hidden;
}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}

/* ---------- NAV / HEADER ---------- */
header{position:sticky;top:0;z-index:60;padding:18px 0;}
.nav{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  background:var(--bg);border:1px solid var(--border-color);
  border-radius:60px;padding:12px 14px 12px 24px;
  box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  transition:background .5s ease,border-color .5s ease;
}
.brand{
  display:flex;align-items:center;gap:10px;color:var(--text-primary);
  font-family:'HaasGrot Disp',sans-serif;font-weight:500;font-size:1.1rem;letter-spacing:.01em;
}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
.theme-toggle{
  width:46px;height:46px;border-radius:50%;
  border:1px solid var(--chip-active-bg);
  background:var(--chip-active-bg);color:var(--chip-active-text);cursor:pointer;
  display:grid;place-items:center;flex:0 0 auto;
  transition:transform .4s ease,opacity .3s ease,background .5s ease,color .5s ease,border-color .5s ease;
}
.theme-toggle:hover{transform:rotate(35deg);opacity:.9}

/* ---------- CATALOG ---------- */
.catalog{padding:34px 0 40px}
.cat-head{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:20px;margin-bottom:34px}
.cat-head h2{
  font-family:'HaasGrot Disp',sans-serif;font-weight:300;
  font-size:clamp(2.6rem,7vw,4.4rem);line-height:.96;letter-spacing:-.02em;color:var(--text-primary);
}
.count{font-size:.9rem;color:var(--text-secondary);letter-spacing:.05em;margin-top:10px}
.search{position:relative;flex:1;min-width:240px;max-width:340px}
.search input{
  width:100%;background:transparent;border:1px solid var(--border-color);border-radius:40px;
  padding:14px 20px 14px 46px;font-family:'Jost';font-size:.95rem;color:var(--text-primary);
  outline:none;transition:border-color .25s ease,color .5s ease;
}
.search input::placeholder{color:var(--placeholder)}
.search input:focus{border-color:var(--text-primary)}
.search svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--text-secondary)}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:40px}
.chip{
  background:var(--chip-bg);border:1px solid var(--border-color);border-radius:40px;
  padding:9px 18px;font-family:'Jost';font-size:.85rem;letter-spacing:.03em;color:var(--chip-text);
  cursor:pointer;white-space:nowrap;
  transition:background .25s ease,color .25s ease,border-color .25s ease;
}
.chip:hover{color:var(--text-primary);border-color:var(--text-primary)}
.chip.active{background:var(--chip-active-bg);color:var(--chip-active-text);border-color:var(--chip-active-bg)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:22px}
.product{
  background:var(--card-bg);color:var(--text-primary);
  border:1px solid var(--border-color);border-radius:22px;
  padding:18px;display:flex;flex-direction:column;
  transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s ease,background .5s ease,border-color .5s ease,color .5s ease;
  animation:rise .6s both;
}
.product:hover{transform:translateY(-6px);box-shadow:var(--shadow)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.thumb{
  border-radius:16px;aspect-ratio:4/3;margin-bottom:16px;
  display:grid;place-items:center;position:relative;overflow:hidden;
}
.thumb .mono{font-family:'HaasGrot Disp',sans-serif;font-weight:500;font-size:2.1rem;color:#fff;letter-spacing:.01em;text-shadow:0 2px 14px rgba(0,0,0,.3)}
.thumb::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.18),transparent 60%)}
.brand-tag{font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:500;margin-bottom:7px}
.p-name{font-family:'HaasGrot Disp',sans-serif;font-size:1.18rem;font-weight:500;line-height:1.2;letter-spacing:-.01em;margin-bottom:auto;color:var(--text-primary)}
.p-desc{font-size:.82rem;color:var(--text-secondary);line-height:1.5;margin-top:8px}
.p-foot{display:flex;align-items:center;margin-top:18px;padding-top:14px;border-top:1px solid var(--border-color)}
.price{font-family:'HaasGrot Disp',sans-serif;font-weight:500;font-size:1.2rem;color:var(--text-primary)}
.price.poa{font-family:'Jost';font-size:.8rem;font-weight:400;letter-spacing:.05em;text-transform:uppercase;color:var(--text-secondary)}
.empty{text-align:center;padding:80px 0;color:var(--text-secondary);font-family:'HaasGrot Disp',sans-serif;font-size:1.5rem;font-weight:300;grid-column:1/-1}

/* ---------- FOOTER ---------- */
footer{border-top:1px solid var(--border-color);margin-top:80px;padding:54px 0 70px;text-align:center}
.f-logo{font-family:'HaasGrot Disp',sans-serif;font-size:2.4rem;font-weight:500;letter-spacing:-.01em;color:var(--text-primary)}
.f-logo em{font-style:normal;font-weight:300}
.f-note{color:var(--text-secondary);font-size:.82rem;margin-top:14px;letter-spacing:.04em;max-width:540px;margin-left:auto;margin-right:auto;line-height:1.6}

@media(max-width:640px){
  .brand{font-size:.98rem}
  .theme-toggle{width:42px;height:42px}
}
</style>

/* ---------- RENDER ---------- */
const brands = [...new Set(PRODUCTS.map(p=>p.b))];
const grid=document.getElementById('grid');
const filters=document.getElementById('filters');
const countEl=document.getElementById('count');
let activeBrand="all", query="";

function monogram(b){
  const skip=["&","de","by","la"];
  const words=b.split(/[\s&·]+/).filter(w=>w && !skip.includes(w.toLowerCase()));
  return words.slice(0,2).map(w=>w[0]).join("").toUpperCase();
}

function makeChip(label,val){
  const c=document.createElement('button');
  c.className='chip'+(val===activeBrand?' active':'');
  c.textContent=label;
  c.onclick=()=>{activeBrand=val;render();[...filters.children].forEach(x=>x.classList.remove('active'));c.classList.add('active');};
  return c;
}
filters.appendChild(makeChip("Все бренды","all"));
brands.forEach(b=>filters.appendChild(makeChip(b,b)));

function render(){
  const list=PRODUCTS.filter(p=>{
    const okBrand=activeBrand==="all"||p.b===activeBrand;
    const q=query.toLowerCase();
    const okQ=!q||p.n.toLowerCase().includes(q)||p.b.toLowerCase().includes(q)||p.d.toLowerCase().includes(q);
    return okBrand&&okQ;
  });
  countEl.textContent=list.length+" товаров · "+brands.length+" брендов";
  grid.innerHTML="";
  if(!list.length){grid.innerHTML='<div class="empty">Ничего не найдено</div>';return;}
  list.forEach((p,i)=>{
    const el=document.createElement('article');
    el.className='product';
    el.style.animationDelay=(Math.min(i,12)*0.03)+'s';
    el.innerHTML=`
      <div class="thumb" style="background:linear-gradient(150deg,${p.c},${shade(p.c,-22)})">
        <span class="mono">${monogram(p.b)}</span>
      </div>
      <div class="brand-tag">${p.b}</div>
      <div class="p-name">${p.n}</div>
      <div class="p-desc">${p.d}</div>
      <div class="p-foot">
        <span class="price${p.p.startsWith('$')?'':' poa'}">${p.p}</span>
      </div>`;
    grid.appendChild(el);
  });
}

function shade(hex,amt){
  let c=hex.replace('#','');
  if(c.length===3)c=c.split('').map(x=>x+x).join('');
  let r=Math.max(0,Math.min(255,parseInt(c.slice(0,2),16)+amt));
  let g=Math.max(0,Math.min(255,parseInt(c.slice(2,4),16)+amt));
  let b=Math.max(0,Math.min(255,parseInt(c.slice(4,6),16)+amt));
  return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
}

document.getElementById('search').addEventListener('input',e=>{query=e.target.value;render();});

/* ---------- THEME TOGGLE ---------- */
const SUN='<circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
const MOON='<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>';
const root=document.documentElement;
const iconEl=document.getElementById('icon');
function setIcon(){
  const dark = root.getAttribute('data-theme')==='dark';
  iconEl.innerHTML = dark ? SUN : MOON;
  const m=document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute('content', dark ? '#111111' : '#FFFFFF');
}
document.getElementById('themeBtn').onclick=()=>{
  root.setAttribute('data-theme', root.getAttribute('data-theme')==='dark'?'light':'dark');
  setIcon();
};
setIcon();

render();
